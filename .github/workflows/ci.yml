name: ci

on: [push, pull_request]

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        st-version: [3, 4]
        # os: ["ubuntu-latest", "macOS-latest", "windows-latest"]
        os: ["ubuntu-latest"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: SublimeText/UnitTesting/actions/setup@c18f8d0731f28d028e6770d4b6f3f3cbcfcc24d9
        with:
          package-name: Constellation
          sublime-text-version: ${{ matrix.st-version }}
      # superstitious sleep to avoid "output frozen" errors
      - run: sleep 2
      - uses: SublimeText/UnitTesting/actions/run-tests@c18f8d0731f28d028e6770d4b6f3f3cbcfcc24d9
        with:
          coverage: false
          package-name: Constellation
